name: Build Android Debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        run: |
          APK_PATH="build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK was not generated at $APK_PATH"
            echo "APK files found:"
            find build/outputs -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi
          echo "APK generated: $APK_PATH"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: company-debug-apk
          path: build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
