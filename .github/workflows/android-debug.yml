# Permanent signing key verification
name: Build Android Debug APK
   
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Require the permanent signing key. Never silently fall back to a generated key.
      - name: Install and verify permanent Android debug keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_DEBUG_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_DEBUG_KEYSTORE_PASSWORD}" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 or ANDROID_DEBUG_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          ACTUAL_SHA1=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass "$ANDROID_DEBUG_KEYSTORE_PASSWORD" -alias androiddebugkey 2>/dev/null | awk -F': ' '/SHA1:/{print $NF; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')

          if [ -z "$ACTUAL_SHA1" ]; then
            echo "::error::Could not read SHA-1 from the permanent keystore."
            exit 1
          fi
          # Pin the public certificate fingerprint so rotating the GitHub secret
          # cannot silently change the Android signing identity.
          PINNED_ANDROID_DEBUG_SHA1="7743BA75342D64EDD9B66C4018C17F0BA65BE063"
          if [ "$ACTUAL_SHA1" != "$PINNED_ANDROID_DEBUG_SHA1" ]; then
            echo "::error::Permanent keystore mismatch. Expected $PINNED_ANDROID_DEBUG_SHA1 but found $ACTUAL_SHA1."
            exit 1
          fi
          echo "EXPECTED_APK_SHA1=$PINNED_ANDROID_DEBUG_SHA1" >> "$GITHUB_ENV"
          echo "Permanent keystore verified against pinned SHA-1: $PINNED_ANDROID_DEBUG_SHA1"

      - name: Find Gradle project
        shell: bash
        run: |
          PROJECT_DIR=""

          if [ -f "./settings.gradle.kts" ] || [ -f "./settings.gradle" ]; then
            PROJECT_DIR="."
          else
            SETTINGS_FILE=$(find . -maxdepth 5 -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -not -path "*/.gradle/*" | head -n 1)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: Gradle settings file not found!"
              find . -maxdepth 4 -type f | sort
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Gradle project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build APK (retry Maven rate limits)
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          set +e

          for attempt in 1 2 3 4 5; do
            echo "Build attempt ${attempt}/5"
            gradle --no-daemon --max-workers=2 --no-parallel clean assembleDebug 2>&1 | tee "${RUNNER_TEMP}/gradle-build-${attempt}.log"
            status=${PIPESTATUS[0]}

            if [ "$status" -eq 0 ]; then
              echo "Build succeeded on attempt ${attempt}"
              exit 0
            fi

            if ! grep -Eqi 'HTTP 429|status code 429|Too Many Requests' "${RUNNER_TEMP}/gradle-build-${attempt}.log"; then
              echo "Build failed for a reason other than Maven HTTP 429; stopping retries."
              exit "$status"
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 15))
              echo "Maven Central rate limit detected. Waiting ${delay}s before retry..."
              sleep "$delay"
            fi
          done

          echo "ERROR: Maven Central continued returning HTTP 429 after 5 attempts."
          exit 1

      - name: Find APK
        shell: bash
        run: |
          APK_PATH=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK found: $APK_PATH"

      - name: Extract APK Signing Fingerprints
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            echo "Android SDK: $SDK_ROOT"
            exit 1
          fi

          echo "======================================"
          echo "APK SIGNATURE INFORMATION"
          echo "======================================"

          SIGNATURE_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH" 2>&1)
          echo "$SIGNATURE_INFO"

          ACTUAL_APK_SHA1=$(printf '%s\n' "$SIGNATURE_INFO" | awk '/certificate SHA-1 digest:/{print $NF; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          echo "APK signer SHA-1 (normalized): $ACTUAL_APK_SHA1"
          echo "Expected keystore SHA-1: $EXPECTED_APK_SHA1"
          if [ -z "$ACTUAL_APK_SHA1" ] || [ "$ACTUAL_APK_SHA1" != "$EXPECTED_APK_SHA1" ]; then
            echo "::error::The generated APK is not signed with the permanent keystore."
            exit 1
          fi
          echo "APK signature matches the permanent keystore."

          echo "======================================"
          echo "APK PACKAGE INFORMATION"
          echo "======================================"

          AAPT=$(find "$SDK_ROOT/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK_PATH" | head -n 1
          fi

          echo "======================================"
          echo "FINGERPRINT EXTRACTION COMPLETED"
          echo "======================================"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: company-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
