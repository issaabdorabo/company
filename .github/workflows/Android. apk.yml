
name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          test -s debug.keystore

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle assembleDebug

      - name: Find and Prepare APK
        run: |
          echo "Searching for generated APK files..."

          find . -type f -name "*.apk" -print

          APK_PATH=$(find . -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            ! -name "*unaligned*" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK file was found."
            echo "Build output directory contents:"
            find . -type f -path "*/build/outputs/*" -print
            exit 1
          fi

          echo "Found APK: $APK_PATH"

          cp "$APK_PATH" smart-inventory-debug.apk

          echo "APK copied successfully:"
          ls -lh smart-inventory-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-inventory-debug-apk
          path: smart-inventory-debug.apk
          retention-days: 30
