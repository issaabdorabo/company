name: Build APK 
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 1. فك الضغط وترتيب الملفات
    - name: Unzip and Organize
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE"
          rm "$ZIP_FILE"
        fi
        for dir in */; do
          if [ -f "${dir}settings.gradle.kts" ] || [ -f "${dir}build.gradle.kts" ] || [ -f "${dir}build.gradle" ]; then
            shopt -s dotglob
            mv "${dir}"* .
            rmdir "${dir}"
            break
          fi
        done

    # 2. إصلاح تلقائي لملف settings.gradle.kts (مهم جداً لأن مشروعك لا يحتوي على مجلد app)
    - name: Fix settings.gradle.kts
      run: |
        if [ ! -d "app" ]; then
          echo "app folder is missing. Patching settings.gradle.kts..."
          sed -i '/include(":app")/d' settings.gradle.kts
          sed -i '/project(":app").projectDir/d' settings.gradle.kts
        fi

    # 3. التحقق من ملف Firebase الحقيقي (حذفنا إنشاء الملف الوهمي)
    - name: Verify real google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        # إذا لم يكن الملف موجوداً في المستودع، قم باستعادته من الـ Secrets
        if [ ! -f google-services.json ]; then
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "Restored google-services.json from GitHub Secret."
          else
            echo "::error::google-services.json is missing! Please add it to the repository or Secrets."
            exit 1
          fi
        fi
        
        # التأكد من أنه ليس مشروعاً وهمياً
        if grep -qE '"project_id": *"(remixed-project-id|dummy-project)"' google-services.json; then
          echo "::error::google-services.json contains a placeholder project_id."
          exit 1
        fi

    # 4. إنشاء ملف التوقيع وطباعة البصمة
    - name: Generate Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        echo "================= SHA-1 FINGERPRINT ================="
        keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Build with Gradle
      run: gradle assembleDebug

    # 5. رفع أي ملف APK يتم إنشاؤه مهما كان اسمه
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/*.apk'
