
name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle Project
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(realpath "$(dirname "$SETTINGS_FILE")")

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Debug Keystore
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          cd "$PROJECT_DIR"

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore

          elif [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore

          elif [ -f debug.keystore ]; then
            echo "Using existing debug keystore"

          else
            echo "No existing debug keystore found."
            echo "Generating a new debug keystore."

            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Debug keystore SHA-1:"
          keytool -list -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep SHA1

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK is ready."

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Gradle Settings
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Checking settings.gradle.kts"

          if grep -Eq 'include[[:space:]]*\\([[:space:]]*["\x27]:app' settings.gradle.kts 2>/dev/null; then
            echo "ERROR: settings.gradle.kts still includes :app"
            echo "The app module does not exist in the repository."
            exit 1
          fi

          echo "Gradle settings check completed."

      - name: Build Debug APK
        shell: bash
        run: |
          echo "Building project from:"
          echo "$PROJECT_DIR"

          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          echo "Searching for APK..."

          APK_PATH=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated"
            find "$PROJECT_DIR" -type d -name build -print
            exit 1
          fi

          APK_PATH=$(realpath "$APK_PATH")

          echo "APK found:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-inventory-debug-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30
