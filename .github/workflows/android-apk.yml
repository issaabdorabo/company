
name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle Project
        shell: bash
        run: |
          echo "Repository directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "Searching for settings.gradle files..."

          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            echo "No settings file found. Searching for build.gradle files..."

            BUILD_FILE=$(find . \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "*/.git/*" \
              -print -quit)

            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: No Gradle project files found!"
              find . -maxdepth 6 -type f -print
              exit 1
            fi

            PROJECT_DIR=$(dirname "$BUILD_FILE")
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare debug keystore
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Debug keystore is ready."

      - name: Verify Existing Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory not found"
            exit 1
          fi

          echo "Android SDK contents:"
          ls "$ANDROID_HOME"

          echo "Installed platforms:"
          ls "$ANDROID_HOME/platforms" || true

          echo "Installed build tools:"
          ls "$ANDROID_HOME/build-tools" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        shell: bash
        run: |
          echo "Building project from:"
          echo "$PROJECT_DIR"

          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          echo "Searching for generated APK files..."

          find "$PROJECT_DIR" -type f -name "*.apk" -print

          APK_PATH=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No Debug APK was generated."

            echo "Checking build directories:"
            find "$PROJECT_DIR" -type d -name build -print

            exit 1
          fi

          APK_PATH=$(realpath "$APK_PATH")

          echo "APK successfully found:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-inventory-debug-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30
