
name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: Verify Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          sdkmanager --version
          adb version

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          echo "Searching for generated APK files..."

          find . -type f -name "*.apk" -print

          APK_PATH=$(find . -type f -path "*/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No Debug APK was found."
            echo "Checking build directories:"
            find . -type d -name build -print
            exit 1
          fi

          echo "APK found: $APK_PATH"
          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-inventory-debug-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30
